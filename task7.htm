<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Configurations</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }
    body {
      margin: 0;
      background-color: #f4f4f4;
    }
    .topbar {
      background-color: white;
      padding: 15px 20px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topbar .menu {
      display: flex;
      gap: 25px;
      font-weight: 500;
    }
    .menu{
        padding-right:47%;
        font-size: 12px;
        color: #8c8c8c;
    }
    .conif{
        position: absolute;
        left: 86%;
        font-size: medium;
        color: black;
    }
    .sidebar {
      background-color: #1f1f1f;
      color: white;
      width: 250px;
      position: fixed;
      top: 58px;
      bottom: 0;
      left: 0;
      padding-top: 30px;
    }
    .sidebar a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      color: #ccc;
      text-decoration: none;
    }
    .sidebar a:hover,
    .sidebar a.active {
      background-color: #2a2a2a;
      color: white;
    }
    .sidebar{
        font-size: 13px;
    }
    .content {
        
      margin-left: 250px;
      padding: 30px;
      padding-top: 80px;
    }
    .section {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
      position: relative;
    }
    .section h3 {
      margin-top: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 24px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 10px;
    }
    .form-grid label {
      display: flex;
      flex-direction: column;
    }
    .form-grid input, .form-grid select {
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .readonly {
      background-color: #eee;
    }
    .btn-group {
      margin-top: 15px;
      display: none;
      text-align: right;
    }
    button {
      padding: 8px 14px;
      margin-left: 10px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .edit-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }
    .save-btn { background-color: #28a745; color: white; }
    .cancel-btn { background-color: #dc3545; color: white; }
  </style>
</head>
<body>
  <div class="topbar">
    <div><strong><img src="https://images.vexels.com/media/users/3/137692/isolated/preview/e425fa1fe274a2267405829771f13a13-simple-logo-geometric-polygonal.png" alt="" height="25px" width="25px">Logo</strong></div>
    <div class="menu">
      <span>Outlets</span>
      <span>TAX</span>
      <span>Cuisines</span>
      <span>Order Management</span>
      <span>Point of Sale</span>
      <span class="conif">Configurations</span>
    </div>
    <div>User</div>
  </div>
  <div class="sidebar">
    <a class="active">SMTP Setup</a>
    <a>Incoming Mail Setup</a>
    <a>SMS Gateway Setup</a>
    <a>Payment Gateway</a>
    <a>Other Setup</a>
    <a>Keys & IDs</a>
  </div>
  <div class="content">
    <div class="section">
      <h3>SMTP Setup <button class="edit-btn" id="editBtn"><img src="https://cdn-icons-png.flaticon.com/256/764/764599.png" alt="" height="20px" width="20px"></button></h3>
      <hr>
      <div class="form-grid">
        <label>SMTP Server <input type="text" name="smtpServer" value="testserver.net" class="readonly" readonly></label>
        <label>SMTP Port <input type="text" name="smtpPort" value="123" class="readonly" readonly></label>
        <label>SMTP User <input type="text" name="smtpUser" value="user@example.com" class="readonly" readonly></label>
        <label>SMTP Password <input type="password" name="smtpPassword" value="password" class="readonly" readonly></label>
        <label><input type="checkbox" disabled> SMTP Enable SSL</label>
      </div>
      <br><br>
      <h3>Incoming Mail Setup</h3>
      <hr>
      <div class="form-grid">
        <label>Incoming Mail Protocol <input type="text" name="mailProtocol" value="Select an option" class="readonly" readonly></label>
        <label>Incoming Mail Server <input type="text" name="mailServer" value="server@mail.com" class="readonly" readonly></label>
        <label>Incoming Mail Password <input type="password" name="mailPassword" value="password" class="readonly" readonly></label>
        <label>Incoming Mail User <input type="text" name="mailUser" value="user@example.com" class="readonly" readonly></label>
        <label>Incoming Mail Port <input type="text" name="mailPort" value="456" class="readonly" readonly></label>
      </div>
      <br><br>
      <h3>SMS Gateway Setup</h3>
      <hr>
      <div class="form-grid">
        <label>SMS Gateway <input type="text" name="smsGateway" value="Gateway" class="readonly" readonly></label>
        <label>Password <input type="password" name="smsPassword" value="password" class="readonly" readonly></label>
        <label>API_ID <input type="text" name="smsAPI" value="1234567" class="readonly" readonly></label>
        <label>URL <input type="text" name="smsURL" value="https://www.google.com/" class="readonly" readonly></label>
      </div>
      <br><br>
      <h3>Payment Gateway</h3>
      <hr>
      <div class="form-grid">
        <label>Payment Gateway <input type="text" name="paymentGateway" value="Enter Payment Gateway" class="readonly" readonly></label>
        <label>URL <input type="text" name="paymentURL" value="https://www.google.com/" class="readonly" readonly></label>
        <label>Key <input type="text" name="paymentKey" value="1234567" class="readonly" readonly></label>
      </div>
      <div class="btn-group">
        <button type="button" class="save-btn" id="saveBtn">Save</button>
        <button type="button" class="cancel-btn" id="cancelBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    const originalValues = {};

    $(document).ready(function() {
      $(".section input").each(function() {
        originalValues[$(this).attr("name")] = $(this).val();
      });

      $('#editBtn').click(function() {
        $('.section input').prop('readonly', false).removeClass('readonly');
        $('.btn-group').show();
        $('#editBtn').hide();
      });

      $('#cancelBtn').click(function() {
        $.each(originalValues, function(name, value) {
          $('[name="' + name + '"]').val(value).prop('readonly', true).addClass('readonly');
        });
        $('.btn-group').hide();
        $('#editBtn').show();
      });

      $('#saveBtn').click(function() {
        $('.section input').each(function() {
          originalValues[$(this).attr("name")] = $(this).val();
        });
        $('.section input').prop('readonly', true).addClass('readonly');
        $('.btn-group').hide();
        $('#editBtn').show();
        alert('Changes saved successfully!');
      });
    });
  </script>
</body>
</html>
